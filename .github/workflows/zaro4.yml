name: zaro4

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Caro Bot (Embryo Caro6, Linux native)
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.9' }}
        run: |
          echo "Starting zaro4.py; it will auto-restart until job timeout (6h)"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting zaro4.py ==="
            python3 zaro4.py || echo "zaro4.py exited with code $?"
            echo "Restarting zaro4.py in 10 seconds"
            sleep 10
          done
