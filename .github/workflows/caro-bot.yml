name: Caro Bot Runner

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    # Chạy mỗi ngày lúc 00:00 UTC (10:00 ICT)
    - cron: '0 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Wine (for EMBRYO26 Windows binary)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 wine32 2>/dev/null || sudo apt-get install -y -qq wine
          wine64 --version 2>/dev/null || wine --version 2>/dev/null || echo "[WARN] Wine not available"

      - name: Install Python dependencies
        run: |
          pip install websockets requests --break-system-packages

      - name: Run Caro Bot (EMBRYO26)
        env:
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
        run: |
          python3 bot2.py
