name: Caro Bot Runner

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Wine + Xvfb (for EMBRYO26)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 wine32 xvfb
          # Start virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x16 &
          sleep 1
          wine64 --version || wine --version || echo "[WARN] Wine unavailable"

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Caro Bot (EMBRYO26 via Wine)
        env:
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
          DISPLAY: ':99'
          WINEDEBUG: '-all'
          WINEPREFIX: '/tmp/.wine'
        run: python3 bot2.py
