name: Caro Bot Runner

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    # Chạy mỗi ngày lúc 00:00 UTC (10:00 ICT)
    - cron: '0 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install websockets requests --break-system-packages

      - name: Download AlphaGomoku engine
        run: |
          mkdir -p alphagomoku-engine
          if [ ! -f alphagomoku-engine/pbrain-embryo-1.2.0-6f650fab-c6 ]; then
            echo "[SETUP] Downloading AlphaGomoku engine..."
            curl -sL "https://raw.githubusercontent.com/Hexik/Embryo_engine/master/Caro6/Linux/pbrain-embryo-1.2.0-6f650fab-c6.bz2" -o /tmp/embryo.bz2
            python3 -c "import bz2; bz2.BZ2File('/tmp/embryo.bz2','rb').read(); import shutil; open('alphagomoku-engine/pbrain-embryo-1.2.0-6f650fab-c6','wb').write(bz2.BZ2File('/tmp/embryo.bz2','rb').read()); import os; os.remove('/tmp/embryo.bz2')"
            chmod +x alphagomoku-engine/pbrain-embryo-1.2.0-6f650fab-c6
            echo "[SETUP] AlphaGomoku ready!"
          else
            echo "[SETUP] Engine already exists"
          fi

      - name: Run Caro Bot
        env:
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
        run: |
          python3 bot2.py
