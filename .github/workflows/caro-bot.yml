name: Caro Bot Runner

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Download Embryo engine (Linux native)
        run: |
          mkdir -p alphagomoku-engine
          ENGINE_BIN="alphagomoku-engine/pbrain-embryo-1.2.0-6f650fab-c6"
          if [ ! -f "$ENGINE_BIN" ]; then
            echo "[SETUP] Downloading Embryo 1.2.0..."
            curl -sL -H "User-Agent: Mozilla/5.0" -o /tmp/embryo.bz2 "https://raw.githubusercontent.com/Hexik/Embryo_engine/master/Caro6/Linux/pbrain-embryo-1.2.0-6f650fab-c6.bz2"
            python3 -c "import bz2; data=bz2.BZ2File('/tmp/embryo.bz2','rb').read(); open('$ENGINE_BIN','wb').write(data)"
            rm -f /tmp/embryo.bz2
            chmod +x "$ENGINE_BIN"
            echo "[SETUP] Embryo 1.2.0 ready!"
          else
            echo "[SETUP] Engine already exists"
          fi

      - name: Run Caro Bot
        env:
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
        run: python3 bot2.py
