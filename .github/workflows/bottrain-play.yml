name: BOTTRAIN-Play
on:
  workflow_run:
    workflows: [BOTTRAIN-Train]
    types: [completed]
  workflow_dispatch:
env:
  CARO_USER: ${ { secrets.CARO_USER }}
  CARO_PASSWD: ${ { secrets.CARO_PASSWD }}
  CARO_RUNTIME_HOURS: '2'
  MCTS_PLAYOUT: '200'
jobs:
  play-gamevh:
    if: ${ { github_event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install numpy websockets requests
      - name: Run BOTTRAIN on gamevh
        run: python3 bottrain.py