name: nguyen5

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Wine (for VibeFive Windows exe)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine32 wine64 xvfb
          wine --version

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Caro Bot VibeFive (loop until timeout)
        env:
          DISPLAY: ":99"
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          CARO_USER1: ${{ secrets.CARO_USER1 || secrets.CARO_USER }}
          CARO_PASSWD1: ${{ secrets.CARO_PASSWD1 || secrets.CARO_PASSWD }}
        run: |
          echo "Starting nguyen5.py loop - will auto-restart on exit until job timeout (6h)"
          while true; do
            echo "=== $(date) Starting nguyen5.py ==="
            python3 nguyen5.py || echo "nguyen5.py exited with code $?"
            echo "=== $(date) nguyen5.py finished, restarting in 10s ==="
            sleep 10
          done
