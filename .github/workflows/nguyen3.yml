name: nguyen3

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Wine (for Embryo 2025 Windows exe)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine32 wine64 xvfb
          wine --version

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Caro Bot (loop until timeout)
        env:
          DISPLAY: ":99"
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
        run: |
          echo "Starting nguyen3.py loop - will auto-restart on exit until job timeout (6h)"
          while true; do
            echo "=== $(date) Starting nguyen3.py ==="
            python3 nguyen3.py || echo "nguyen3.py exited with code $?"
            echo "=== $(date) nguyen3.py finished, restarting in 10s ==="
            sleep 10
          done
      - name: Auto-restart workflow (khi hết phiên tự chạy tiếp)
        if: always()
        run: |
          echo "Job finished at $(date), triggering next run..."
          sleep 5
          gh workflow run "$(basename ${{ github.workflow }})" --ref ${{ github.ref_name }} || echo "gh run failed, will rely on cron"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

