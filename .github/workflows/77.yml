name: 77 (Xiangqi - nguyen19)

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websocket-client requests --break-system-packages

      - name: Cache Pikafish engine
        id: cache-pikafish
        uses: actions/cache@v4
        with:
          path: |
            ~/pikafish
            ~/pikafish.nnue
          key: pikafish-2026-01-02-linux

      - name: Download Pikafish engine + NNUE
        if: steps.cache-pikafish.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          PK_URL="https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/Pikafish.2026-01-02.7z"
          curl -sL -o /tmp/pikafish.7z "$PK_URL"
          7z x -y -o/tmp/pikafish /tmp/pikafish.7z > /dev/null

          # Chọn binary phù hợp với CPU của runner
          if grep -q avx512vnni /proc/cpuinfo; then BIN=pikafish-vnni512
          elif grep -q avx512f /proc/cpuinfo;  then BIN=pikafish-avx512
          elif grep -q bmi2 /proc/cpuinfo;     then BIN=pikafish-bmi2
          elif grep -q avx2 /proc/cpuinfo;     then BIN=pikafish-avx2
          else BIN=pikafish-sse41-popcnt; fi
          echo "[ENGINE] Chọn $BIN"

          cp "/tmp/pikafish/Linux/$BIN" "$HOME/pikafish"
          chmod +x "$HOME/pikafish"
          if [ -f /tmp/pikafish/pikafish.nnue ]; then
            cp /tmp/pikafish/pikafish.nnue "$HOME/pikafish.nnue"
          else
            curl -sL -o "$HOME/pikafish.nnue" \
              https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue
          fi

          # Nếu binary chọn sai (CPU không hỗ trợ) thì hạ cấp dần
          if ! echo -e "uci\nquit" | "$HOME/pikafish" > /dev/null 2>&1; then
            echo "[ENGINE] $BIN không chạy được, fallback sse41-popcnt"
            cp /tmp/pikafish/Linux/pikafish-sse41-popcnt "$HOME/pikafish"
            chmod +x "$HOME/pikafish"
          fi

      - name: Verify engine
        run: |
          chmod +x "$HOME/pikafish"
          ls -lh "$HOME/pikafish" "$HOME/pikafish.nnue"
          echo -e "uci\nquit" | "$HOME/pikafish" | head -3

      - name: Run Xiangqi Bot 77 (tài khoản nguyen19)
        env:
          CARO_USER19: ${{ secrets.CARO_USER19 }}
          CARO_PASSWD19: ${{ secrets.CARO_PASSWD19 }}
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
        run: |
          echo "Starting 77.py; it will auto-restart until job timeout (~6h)"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting 77.py ==="
            python3 -u 77.py || echo "77.py exited with code $?"
            echo "Restarting 77.py in 10 seconds"
            sleep 10
          done
