name: Caro Bot AlphaGomoku Rule 9

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: "Runtime in hours"
        required: true
        default: "2"
        type: string
      identity_test_only:
        description: "Update identity only; do not connect to the game"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: caro-bot-rule9
  cancel-in-progress: true

jobs:
  run-bot-rule9:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade requests websockets

      - name: Run AlphaGomoku Rule 9 bot
        env:
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours }}
          CARO_AUTO_IDENTITY: "1"
          CARO_IDENTITY_TEST_ONLY: ${{ inputs.identity_test_only && '1' || '0' }}
        run: python -u bot3.py

      - name: Show match statistics
        if: always()
        run: |
          if [ -f /tmp/caro_ag_stats.json ]; then
            cat /tmp/caro_ag_stats.json
          else
            echo "No statistics file was produced."
          fi
