name: nguyen6

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Wine (for AlphaGomoku Windows exe)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine32 wine64 xvfb
          wine --version

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install websockets requests numpy --break-system-packages

      - name: Run Caro Bot (NN region test + collect data)
        env:
          DISPLAY: ":99"
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
          CARO_NN_REGION: "1"
          CARO_NN_COLLECT: "1"
        run: python3 nguyen6.py

      # Sau khi bot chạy xong (hoặc hết giờ), commit dữ liệu ván thật về repo
      - name: Commit collected data
        if: always()
        run: |
          if [ -f nn_real_games.jsonl ]; then
            git config user.name "caro-bot"
            git config user.email "caro-bot@users.noreply.github.com"
            git add nn_real_games.jsonl
            git commit -m "chore: collect nn_real_games.jsonl ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "no change"
            git pull --rebase origin main || true
            git push origin main || echo "push failed"
          else
            echo "No nn_real_games.jsonl produced"
          fi
