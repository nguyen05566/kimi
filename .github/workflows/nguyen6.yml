name: nguyen6

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        default: '5.9'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Wine64 stable
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends wine64 xvfb
          wine64 --version
          # tạo prefix để lần đầu không lag
          xvfb-run -a wine64 wineboot --init || true
          echo "WINE=wine64" >> $GITHUB_ENV

      - name: Install deps
        run: pip install websockets requests

      - name: Check engine permission
        run: |
          ls -lh alphagomoku-engine/ || echo "chưa có engine"
          chmod 755 alphagomoku-engine/pbrain-embryo26* || true
          ls -l alphagomoku-engine/

      - name: Run bot
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.9' }}
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
        run: |
          # BẮT BUỘC dùng xvfb-run để wine có display ảo
          while true; do
            xvfb-run -a python3 nguyen6.py || echo "exit $?"
            sleep 10
          done
