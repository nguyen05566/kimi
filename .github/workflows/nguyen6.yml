name: nguyen6

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.7'
        type: string
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Caro Bot (Linux native engine, no wine)
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.7' }}
          CARO_USER1: ${{ secrets.CARO_USER1 || secrets.CARO_USER }}
          CARO_PASSWD1: ${{ secrets.CARO_PASSWD1 || secrets.CARO_PASSWD }}
        run: |
          echo "Starting nguyen6.py; it will restart after unexpected exits"
          while true; do
            echo "=== $(date -u +'%Y-%m-%dT%H:%M:%SZ') Starting nguyen6.py ==="
            python3 nguyen6.py || echo "nguyen6.py exited with code $?"
            echo "Restarting nguyen6.py in 10 seconds"
            sleep 10
          done

