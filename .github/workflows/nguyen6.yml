
name: nguyen6

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        default: '5.9'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WineHQ stable (fix wine64 not found)
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -qNP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -q
          sudo apt-get install -y --install-recommends winehq-stable xvfb
          echo "=== wine bins ==="
          which wine
          ls -l /usr/bin/wine*
          wine --version
          wine64 --version || true
          xvfb-run -a wine wineboot --init || true

      - name: Install deps
        run: pip install websockets requests

      - name: Fix permission (0o644 -> 0o755)
        run: |
          rm -rf alphagomoku-engine
          mkdir -p alphagomoku-engine
          ls -la
          chmod -R 755 . || true

      - name: Run bot
        env:
          CARO_RUNTIME_HOURS: ${{ inputs.runtime_hours || '5.9' }}
          CARO_USER: ${{ secrets.CARO_USER }}
          CARO_PASSWD: ${{ secrets.CARO_PASSWD }}
          WINEDEBUG: -all
        run: |
          xvfb-run -a python3 nguyen6.py
