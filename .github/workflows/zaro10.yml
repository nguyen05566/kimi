name: zaro10

on:
  workflow_dispatch:
    inputs:
      runtime_hours:
        description: 'Runtime (hours)'
        required: false
        default: '5.9'
        type: string
  # schedule:
  #   - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}-gamevh-account
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install websockets requests --break-system-packages

      - name: Run Caro Bot (Linux native engine, no wine)
        env:
          CARO_RUNTIME_HOURS: ${{ github.event.inputs.runtime_hours || '5.9' }}
          CARO_USER1: ${{ secrets.CARO_USER1 || secrets.CARO_USER }}
          CARO_PASSWD1: ${{ secrets.CARO_PASSWD1 || secrets.CARO_PASSWD }}
        run: python3 zaro10.py
